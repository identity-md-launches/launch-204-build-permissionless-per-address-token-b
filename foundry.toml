[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
remappings = ["forge-std/=lib/forge-std/src/"]

# Compiler selection.
# Every delivered source file pins `pragma solidity 0.8.24;` exactly, so version auto-detection
# resolves all of src/, test/ and script/ to solc 0.8.24. The version is intentionally not forced
# through `solc = "..."`: forcing it would make harness files that pin another 0.8.x release
# uncompilable next to this project, while an exact pragma already guarantees 0.8.24 for our code.
# Offline builds need solc 0.8.24 in the local svm cache (see README, "Toolchain").
auto_detect_solc = true
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "none"

# No escape hatches: the test suite never shells out or touches the filesystem.
ffi = false
fs_permissions = []

[fuzz]
runs = 256

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
